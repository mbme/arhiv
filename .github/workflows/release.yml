name: Build & Release Arhiv

on:
  push:
    tags:
      - '*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Release notes compare the tagged release with its preceding numeric tag.
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          # MinGW for Windows cross-compilation
          packages: mingw-w64
          targets: aarch64-linux-android x86_64-pc-windows-gnu # Android & Windows targets for rustup

      - name: Build Linux CLI
        run: just prod-build

      - name: Build Windows CLI
        run: just prod-build-windows

      - name: Install cargo-ndk
        shell: bash
        run: cargo install --locked cargo-ndk

      - name: Build Android Native Libs
        run: just prod-build-android-libs

      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17' # Gradle plugin target
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/arhiv-release.keystore"

      - name: Write keystore.properties
        run: |
          cat <<EOF > arhiv-android/keystore.properties
          storeFile=$RUNNER_TEMP/arhiv-release.keystore
          storePassword=${{ secrets.KEY_STORE_PASS }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASS }}
          EOF

      - name: Build & Sign Release APK
        run: just prod-build-android-app

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/arhiv-release.keystore" arhiv-android/keystore.properties

      - name: Install git-cliff
        run: cargo install --locked git-cliff --version 2.13.0

      - name: Generate release notes
        run: git-cliff --config cliff.toml --current --output release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-artifacts
          path: |
            arhiv.apk
            release-notes.md
            target/release/arhiv
            target/x86_64-pc-windows-gnu/release/arhiv.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }} # e.g. "42"
          bodyFile: release-artifacts/release-notes.md
          artifacts: 'release-artifacts/arhiv.apk,release-artifacts/target/release/arhiv,release-artifacts/target/x86_64-pc-windows-gnu/release/arhiv.exe'
